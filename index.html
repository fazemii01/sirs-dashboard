<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo-dlh.png" />
  <link rel="preload" href="/logo-dlh.png" as="image" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Marisa | DLH Kabupaten Lumajang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Instant Initial Loader Styles */
    #root:empty, #root:has(> .dlh-initial-loader) {
      background-color: #F7F9FA;
    }
    @keyframes dlhOrbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dlhBeamSlide {
      0% { transform: translateX(-48px); }
      50% { transform: translateX(54px); }
      100% { transform: translateX(130px); }
    }
    .dlh-initial-loader .dlh-orbit-spin {
      animation: dlhOrbitSpin 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .dlh-initial-loader .dlh-beam {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 48px;
      border-radius: 9999px;
      background: linear-gradient(90deg, transparent, #0D6B5F, transparent);
      animation: dlhBeamSlide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Instant Pre-React Loader (displays at 0ms on refresh) -->
    <div class="dlh-initial-loader" style="position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F7F9FA; user-select: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="position: relative; display: flex; align-items: center; justify-content: center;">
        <!-- Soft ambient emerald radiance -->
        <div style="position: absolute; width: 160px; height: 160px; border-radius: 9999px; background: #0D6B5F; opacity: 0.08; filter: blur(32px); pointer-events: none;"></div>

        <!-- Concentric Circular SVG Spinner -->
        <svg class="dlh-orbit-spin" viewBox="0 0 100 100" style="width: 124px; height: 124px; transform-origin: center;">
          <circle cx="50" cy="50" r="42" stroke="#EDF1F3" stroke-width="2.5" fill="none"></circle>
          <circle cx="50" cy="50" r="42" stroke="url(#dlh-initial-gradient)" stroke-width="2.75" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="170" fill="none"></circle>
          <defs>
            <linearGradient id="dlh-initial-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0D6B5F"></stop>
              <stop offset="100%" stop-color="#14957F"></stop>
            </linearGradient>
          </defs>
        </svg>

        <!-- Center Logo Disc: Clean circular white tile, soft elevation, no harsh borders -->
        <div style="position: absolute; width: 74px; height: 74px; border-radius: 9999px; background: #ffffff; box-shadow: 0 4px 20px -2px rgba(13, 107, 95, 0.12), 0 2px 6px -1px rgba(0, 0, 0, 0.04); border: 1px solid rgba(226, 232, 240, 0.85); display: flex; align-items: center; justify-content: center; padding: 12px;">
          <img src="/logo-dlh.png" alt="DLH Lumajang" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
      </div>

      <!-- Brand Typography -->
      <div style="margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;">
        <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #0A4A42;">
          E-Marisa
        </span>
        <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.01em; color: #64748B;">
          Dinas Lingkungan Hidup Kabupaten Lumajang
        </span>

        <!-- Minimalist Indeterminate Progress Bar -->
        <div style="margin-top: 14px; width: 124px; height: 3px; border-radius: 9999px; background: #EDF1F3; overflow: hidden; position: relative;">
          <div class="dlh-beam"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
